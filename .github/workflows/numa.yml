# Aggiorna dati, registro delle previsioni e sito, poi pubblica su GitHub Pages.
# Estrazioni: martedi', giovedi', venerdi' e sabato alle 20:00 (ora di Roma).
name: aggiorna numa

on:
  schedule:
    - cron: "40 19 * * 2,4,5,6"   # dopo l'estrazione (21:40 ora legale, 20:40 ora solare)
    - cron: "30 22 * * 2,4,5,6"   # recupero, se la fonte dei dati e' in ritardo
    - cron: "30 5 * * *"          # ogni mattina: verifica e registra la sestina del giorno
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: numa
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: Test
        run: python -m unittest discover -s tests
      - name: Aggiorna dati, registro e sito
        run: python numa.py build
      - name: Salva nel repository (l'ora del commit certifica la previsione)
        run: |
          git config user.name "numa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Nessuna novita'."
          else
            git commit -m "Aggiornamento automatico $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
